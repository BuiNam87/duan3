<script>
window.sent=[]; window.untrusted=0; window.downloadsFired=[]; let seq=0;
const ed=document.querySelector('.ProseMirror'), list=document.getElementById('list'), ov=document.querySelector('.cdk-overlay-container');
const PNG='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
document.querySelector('.generate-icon-button').onclick=(e)=>{
  if(!e.isTrusted){untrusted++;return;}
  const prompt=ed.innerText.trim(); sent.push(prompt);
  const b=document.createElement('div'); b.className='batch-container virtual-item-container';
  b.innerHTML='<div class="batch-tiles-section"><div class="tile-row"></div></div><flow-batch-info><div class="below-toolbar"><flow-expandable-prompt><div class="prompt-text"><span class="text-part"></span></div></flow-expandable-prompt></div></flow-batch-info>';
  b.querySelector('.text-part').textContent=prompt;
  const row=b.querySelector('.tile-row');
  for(let k=0;k<4;k++){ const t=document.createElement('flow-grid-tile-container'); t.className='mat-context-menu-trigger'; t.textContent='Đang tạo…'; row.appendChild(t);
    setTimeout(()=>{ t.textContent=''; const img=document.createElement('img'); img.className='image'; img.dataset.mediaId='m'+(++seq)+'-'+Math.random().toString(36).slice(2,6); img.src='data:image/png;base64,'+PNG; t.appendChild(img);}, 2500+k*700); }
  list.prepend(b);
};
function closeMenus(){ ov.innerHTML=''; }
function item(label, onClick, sub, subt){ const bt=document.createElement('button'); bt.setAttribute('role','menuitem'); bt.setAttribute('mat-menu-item','');
  bt.innerHTML='<span class="left-content"><span class="item-text"><span class="label"></span></span></span>'; bt.querySelector('.label').textContent=label; if(subt){const d=document.createElement('span'); d.className='description'; d.textContent=subt; bt.querySelector('.item-text').appendChild(d);}
  bt.addEventListener('click',e=>{ if(!e.isTrusted){untrusted++;return;} onClick&&onClick(e);});
  if(sub) bt.addEventListener('mouseenter',sub);
  return bt; }
function menu(x,y,items){ const m=document.createElement('div'); m.className='menu'; m.setAttribute('role','menu'); m.style.left=x+'px'; m.style.top=y+'px'; items.forEach(i=>m.appendChild(i)); ov.appendChild(m); return m; }
list.addEventListener('contextmenu',e=>{
  const tile=e.target.closest('flow-grid-tile-container'); if(!tile) return; e.preventDefault();
  if(!e.isTrusted){untrusted++;return;}
  const img=tile.querySelector('img'); if(!img) return;
  closeMenus();
  let subOpen=false;
  const openSub=()=>{ if(subOpen) return; subOpen=true; const r=m.getBoundingClientRect();
    menu(r.right, r.top+30, [['1K','Kích thước gốc'],['2K','Đã tăng độ phân giải'],['4K','Đã tăng độ phân giải']].map(([l,subt])=>item(l,()=>{
      closeMenus();
      setTimeout(()=>{ const a=document.createElement('a'); a.href='data:image/png;base64,'+PNG; a.download='flow_'+img.dataset.mediaId+'_'+l.replace(/\W+/g,'')+'.png'; document.body.appendChild(a); a.click(); a.remove(); downloadsFired.push(img.dataset.mediaId+':'+l); }, 1500);
    },null,subt))); };
  const m=menu(e.clientX,e.clientY,[item('Yêu thích'),item('Sử dụng lại câu lệnh'),item('Tải xuống',openSub,openSub),item('Sao chép')]);
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeMenus(); });
</script></body></html>
